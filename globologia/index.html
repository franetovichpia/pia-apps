<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Globología · Gestión</title>
<meta name="theme-color" content="#FF6F8E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='26' rx='18' ry='21' fill='%23FF6F8E'/%3E%3Cpath d='M29 46l3 4 3-4z' fill='%23FF6F8E'/%3E%3Cpath d='M32 50c-4 6 4 8 0 14' stroke='%23999' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="f-login" class="login-card">
    <div class="brand big"><span class="balloon"></span>Globología</div>
    <p class="muted">Poné tu PIN. Solo te lo pide la primera vez en este dispositivo.</p>
    <div class="fld"><label for="l-pass">PIN</label><input id="l-pass" type="password" inputmode="numeric" autocomplete="current-password" minlength="6" required placeholder="••••••"></div>
    <button class="btn" type="submit">Ingresar</button>
    <p id="l-err" class="err" hidden></p>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="side">
    <a class="brand" href="../" style="color:inherit;text-decoration:none" title="Volver a mis apps"><span class="balloon"></span>Globología</a>
    <nav class="nav" id="nav-d"></nav>
    <button class="linkbtn side-out" id="logout">‹ Mis apps</button>
  </aside>
  <main><div class="wrap" id="view"></div></main>
  <nav class="tabbar" id="nav-m"></nav>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<script src="app.js"></script>
</body>
</html>
